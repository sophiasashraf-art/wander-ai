[build]
  base = "apps/web"
  command = "pnpm install --no-frozen-lockfile && pnpm run build"
  publish = ".next"

[build.environment]
  # @supabase/supabase-js's RealtimeClient needs native WebSocket, Node 22+ only
  # — it initializes unconditionally even for admin/service-role clients that
  # never touch realtime, so this crashed the transcribe-place background
  # function (and would crash any other function using the admin client) on
  # Node 20. Confirmed via the function's own invoke log.
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Netlify's "set as primary domain" only redirects between your own custom
# domains (e.g. www <-> apex) — it does not touch the original *.netlify.app
# URL, which keeps serving the site directly unless told otherwise.
[[redirects]]
  from = "https://frabjous-narwhal-984ec8.netlify.app/*"
  to = "https://mymapture.com/:splat"
  status = 301
  force = true
